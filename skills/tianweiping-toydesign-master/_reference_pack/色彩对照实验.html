<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同色异背景 · 原创色彩练习</title>
<style>body{font:17px/1.8 system-ui,sans-serif;background:#f5f3ee;color:#17202a;max-width:1000px;margin:40px auto;padding:0 24px}h1{font-size:32px}main{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:25px 0}.field{height:300px;display:grid;place-items:center;border-radius:12px}.sample{width:110px;height:110px;background:rgb(128,128,128)}button{padding:10px 18px;border:1px solid #555;border-radius:8px;background:white;cursor:pointer}input{vertical-align:middle;width:230px}small{display:block;color:#53606d}a{color:#185a86}@media(max-width:600px){.field{height:220px}.sample{width:75px;height:75px}}</style>
<h1>同一个颜色，放进不同背景</h1><p>两个中心色块始终使用相同数值。先观察，再统一背景对照；这里不预设每个人的感知结论。</p>
<label>中心灰度 <input id="level" type="range" min="32" max="223" value="128"> <output id="value">128</output></label>
<main><div class="field" id="left" style="background:#20232b"><div class="sample"></div></div><div class="field" id="right" style="background:#e5e7eb"><div class="sample"></div></div></main>
<button id="toggle" aria-pressed="false">统一背景作对照</button><p id="status" aria-live="polite">中心色块均为 RGB (128, 128, 128)。</p>
<p>记录：哪边看起来更亮？统一背景后是否改变？把这个检查带到真实角色配色中，再判断背景是否需要调整。</p>
<small>独立制作的教学示意，不是艺术家作品的复制，也不是审美水平测试。研究启发：<a href="https://www.albersfoundation.org/alberses/teaching/interaction-of-color">Albers Foundation · Interaction of Color</a>。没有收集或上传数据。</small>
<script>const slider=document.getElementById('level'),value=document.getElementById('value'),status=document.getElementById('status'),button=document.getElementById('toggle');let neutral=false;slider.oninput=()=>{const n=Number(slider.value);document.querySelectorAll('.sample').forEach(e=>e.style.backgroundColor=`rgb(${n},${n},${n})`);value.value=n;status.textContent=`中心色块均为 RGB (${n}, ${n}, ${n})。`};button.onclick=()=>{neutral=!neutral;document.getElementById('left').style.backgroundColor=neutral?'#a0a0a0':'#20232b';document.getElementById('right').style.backgroundColor=neutral?'#a0a0a0':'#e5e7eb';button.textContent=neutral?'恢复不同背景':'统一背景作对照';button.setAttribute('aria-pressed',String(neutral))};</script></html>
